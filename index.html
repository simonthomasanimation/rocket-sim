<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Kármán Program — a 2D rocket simulator set in the paperwork of a 1960s space program.">
  <meta name="theme-color" content="#1B3A6B">
  <title>Kármán Program</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <canvas id="stage" aria-label="Kármán Program flight drawing" role="img"></canvas>
  <div id="overlay">
    <div id="touch-controls" class="touch-controls" aria-label="Flight controls"></div>
    <div id="title-block" class="title-block" aria-hidden="true"></div>
  </div>
  <div id="page"></div>
  <noscript><p class="noscript">Kármán Program needs JavaScript to draw.</p></noscript>
</body>
</html>
