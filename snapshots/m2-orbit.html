  <meta name="theme-color" content="#1B3A6B">
  <title>Kármán Program</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
/* Kármán Program — shared chrome. One grid, three typefaces, four papers. */

:root {
  /* Blueprint paper (flight view) */
  --bp-paper: #1B3A6B;
  --bp-ink: #F2F4F7;
  --bp-ink-2: #A9D6E5;
  --bp-accent: #E4572E;

  /* Typefaces: readouts, headings, running text — each with a system fallback */
  --font-mono: "IBM Plex Mono", "Courier Prime", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
  --font-head: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-text: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --grid: 8px;
  --stroke-structure: 1.5px;
  --stroke-annotation: 0.75px;
  --hud-height: 112px; /* set by main.js: 200px on narrow sheets */
}

html, body {
  margin: 0;
  height: 100%;
  background: var(--bp-paper);
  color: var(--bp-ink);
  overflow: hidden;
  font-family: var(--font-text);
  -webkit-text-size-adjust: 100%;
}

#stage {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

/* Engineering title block, lower right, snapped to the 8px grid */
.title-block {
  position: absolute;
  right: calc(var(--grid) * 2 + env(safe-area-inset-right, 0px));
  bottom: calc(var(--grid) * 2 + env(safe-area-inset-bottom, 0px));
  border: var(--stroke-structure) solid var(--bp-ink);
  background: var(--bp-paper);
  color: var(--bp-ink);
  font: 500 12px/16px var(--font-mono);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  user-select: none;
}

.title-block table {
  border-collapse: collapse;
}

.title-block th,
.title-block td {
  border: var(--stroke-annotation) solid var(--bp-ink-2);
  padding: 4px 8px;
  text-align: left;
  font-weight: inherit;
  white-space: nowrap;
}

.title-block th {
  font-size: 14px;
  line-height: 16px;
  font-weight: 500;
  letter-spacing: 0.12em;
}

.title-block .label {
  color: var(--bp-ink-2);
  font-size: 10px;
  line-height: 16px;
  font-weight: 400;
}

/* Time running faster than real: the WARP cell inverts */
.title-block td.is-active {
  background: var(--bp-ink);
  color: var(--bp-paper);
}

/* A milestone stamp landing on the title block (110% to 100% in 80 ms) */
.title-stamp {
  position: absolute;
  right: -10px;
  top: -24px;
  padding: 1px 8px;
  border: 2px solid var(--bp-accent);
  border-radius: 2px;
  color: var(--bp-accent);
  background: var(--bp-paper);
  font: 700 14px/18px var(--font-head);
  letter-spacing: 0.18em;
  transform: rotate(-8deg) scale(1.1);
  transition: transform 80ms linear;
}
.title-stamp.is-landed { transform: rotate(-8deg) scale(1); }

.noscript {
  position: fixed;
  left: 16px;
  top: 16px;
  margin: 0;
  font: 400 14px/24px var(--font-mono);
}

/* On-screen flight controls: stamped rectangles with text labels. Shown on
   coarse pointers (phones, tablets) or after the first touch anywhere. */
.touch-controls {
  position: absolute;
  inset: 0;
  display: none;
  pointer-events: none;
}
@media (pointer: coarse) { .touch-controls { display: block; } }
.touch-controls.is-touch { display: block; }
.touch-controls.is-hidden { display: none; }

.touch-cluster {
  position: absolute;
  bottom: calc(var(--hud-height) + var(--grid) * 2 + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: var(--grid);
  pointer-events: auto;
}
.touch-left {
  left: calc(var(--grid) * 2 + env(safe-area-inset-left, 0px));
  grid-template-columns: 1fr 1fr;
}
.touch-right {
  right: calc(var(--grid) * 2 + env(safe-area-inset-right, 0px));
  grid-template-columns: 1fr 1fr;
}

.stamp-button {
  appearance: none;
  margin: 0;
  width: 72px;
  height: 56px;
  border: var(--stroke-structure) solid var(--bp-ink);
  border-radius: 2px;
  background: var(--bp-paper);
  color: var(--bp-ink);
  font: 500 13px/16px var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}
.stamp-button.is-down {
  background: var(--bp-ink);
  color: var(--bp-paper);
}

/* Narrow sheets (phones): the title block moves to the top right corner so
   the instrument strip and the on-screen controls keep the bottom. */
@media (max-width: 720px) {
  .title-block {
    bottom: auto;
    top: calc(var(--grid) * 2 + env(safe-area-inset-top, 0px));
  }
  .title-stamp { top: -10px; right: -8px; }
  .title-block th { font-size: 12px; }
}

/* Short sheets (phones held sideways): squatter buttons so the drawing keeps
   some room above the strip. */
@media (max-height: 520px) {
  .stamp-button { height: 40px; }
  .touch-cluster { gap: 4px; }
}

/* --- Manual document: pages laid over the sheet ---------------------------- */
:root {
  --mn-paper: #EFEAE0;
  --mn-ink: #1A1A1A;
  --mn-spot: #E4572E;
  --mn-halftone: rgba(26, 26, 26, 0.10);
}

#page {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: calc(var(--grid) * 2);
  pointer-events: none;
}
#page.is-open { display: flex; pointer-events: auto; }

.manual-page {
  position: relative;
  box-sizing: border-box;
  width: min(100%, 464px);
  max-height: 100%;
  overflow: auto;
  padding: calc(var(--grid) * 3) calc(var(--grid) * 3) calc(var(--grid) * 2);
  border: var(--stroke-structure) solid var(--mn-ink);
  border-radius: 2px;
  background-color: var(--mn-paper);
  /* Halftone shading: a dot screen, 4px pitch, rotated by the offset rows */
  background-image:
    radial-gradient(circle at 1px 1px, var(--mn-halftone) 0.7px, transparent 0.9px),
    radial-gradient(circle at 3px 3px, var(--mn-halftone) 0.7px, transparent 0.9px);
  background-size: 4px 4px;
  color: var(--mn-ink);
  font: 400 15px/24px var(--font-text);
}

.manual-head {
  display: flex;
  justify-content: space-between;
  gap: var(--grid);
  padding-bottom: var(--grid);
  border-bottom: var(--stroke-annotation) solid var(--mn-ink);
  font: 400 11px/16px var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.manual-title {
  margin: calc(var(--grid) * 2) 0 var(--grid);
  font: 700 22px/24px var(--font-head);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.manual-stamp {
  position: absolute;
  top: calc(var(--grid) * 7);
  right: calc(var(--grid) * 3);
  padding: 2px 10px;
  border: 2px solid currentColor;
  border-radius: 2px;
  font: 700 18px/24px var(--font-head);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  transform: rotate(-8deg) scale(1.1);
  transition: transform 80ms linear;
}
.manual-stamp.is-landed { transform: rotate(-8deg) scale(1); }
.tone-ink { color: var(--mn-ink); }
.tone-spot { color: var(--mn-spot); }

.manual-table {
  width: 100%;
  margin: var(--grid) 0;
  border-collapse: collapse;
  font: 400 13px/16px var(--font-mono);
}
.manual-table th,
.manual-table td {
  padding: 4px 0;
  border-bottom: var(--stroke-annotation) solid rgba(26, 26, 26, 0.35);
  text-align: left;
  vertical-align: top;
}
.manual-table th {
  width: 44%;
  font-weight: 400;
  letter-spacing: 0.06em;
  opacity: 0.75;
}
.manual-table td { text-align: right; font-weight: 500; }

.manual-choices {
  display: flex;
  flex-direction: column;
  gap: var(--grid);
  margin: calc(var(--grid) * 2) 0;
}
.manual-choice {
  display: flex;
  align-items: flex-start;
  gap: calc(var(--grid) * 2);
}
.manual-choice .manual-button { flex: none; min-width: 120px; justify-content: space-between; }
.manual-choice p { margin: 0; font: 400 13px/18px var(--font-text); }

.manual-lines {
  margin: var(--grid) 0;
  padding-left: 20px;
}
.manual-lines li { margin: 4px 0; }

.manual-caption {
  margin: var(--grid) 0 calc(var(--grid) * 2);
  font: 400 13px/16px var(--font-text);
}
.manual-caption b { font: 500 11px/16px var(--font-mono); letter-spacing: 0.08em; }

.manual-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: var(--grid);
}
.manual-button {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  padding: 8px 14px;
  border: var(--stroke-structure) solid var(--mn-ink);
  border-radius: 2px;
  background: var(--mn-paper);
  color: var(--mn-ink);
  font: 700 13px/16px var(--font-head);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
}
.manual-button:hover, .manual-button:focus-visible { background: var(--mn-ink); color: var(--mn-paper); outline: none; }
.manual-button kbd {
  padding: 0 5px;
  border: var(--stroke-annotation) solid currentColor;
  border-radius: 2px;
  font: 400 10px/16px var(--font-mono);
}

/* --- Replay transport ------------------------------------------------------ */
#transport {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--hud-height) + var(--grid) * 2 + env(safe-area-inset-bottom, 0px));
  display: none;
  justify-content: center;
  padding: 0 calc(var(--grid) * 2);
  pointer-events: none;
}
#transport.is-open { display: flex; }

.transport-bar {
  box-sizing: border-box;
  width: min(100%, 760px);
  padding: var(--grid);
  border: var(--stroke-structure) solid var(--bp-ink);
  border-radius: 2px;
  background: var(--bp-paper);
  color: var(--bp-ink);
  pointer-events: auto;
}

.transport-tape-row {
  display: flex;
  align-items: center;
  gap: var(--grid);
  margin-bottom: var(--grid);
}
.transport-time {
  flex: none;
  font: 500 12px/16px var(--font-mono);
  letter-spacing: 0.04em;
}
.transport-tape {
  position: relative;
  flex: 1;
  height: 24px;
  border: var(--stroke-annotation) solid var(--bp-ink-2);
  touch-action: none;
  cursor: pointer;
  /* hatched tape, like the fuel gauge */
  background-image: repeating-linear-gradient(135deg, transparent 0 3px, rgba(169, 214, 229, 0.25) 3px 3.75px);
}
.transport-ticks i {
  position: absolute;
  top: 0;
  width: 0;
  height: 6px;
  border-left: var(--stroke-annotation) solid var(--bp-ink-2);
}
.transport-played {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0;
  background-image: repeating-linear-gradient(135deg, transparent 0 3px, var(--bp-ink) 3px 3.75px);
}
.transport-head {
  position: absolute;
  top: -4px;
  bottom: -4px;
  width: 0;
  border-left: var(--stroke-structure) solid var(--bp-ink);
  margin-left: -0.75px;
}

.transport-buttons {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: var(--grid);
}
.transport-group { display: flex; gap: var(--grid); }
.transport-left { justify-self: start; }
.transport-centre { justify-self: center; }
.transport-button {
  width: auto;
  height: 40px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.transport-button kbd {
  padding: 0 4px;
  border: var(--stroke-annotation) solid currentColor;
  border-radius: 2px;
  font: 400 9px/14px var(--font-mono);
}
.transport-speed {
  justify-self: end;
  font: 500 12px/16px var(--font-mono);
  letter-spacing: 0.06em;
  color: var(--bp-ink-2);
}
@media (max-width: 860px) {
  .transport-button kbd { display: none; }
}
@media (max-width: 720px) {
  /* Shuttle group on its own row, EXIT and the speed beneath it. */
  .transport-buttons { grid-template-columns: 1fr 1fr; }
  .transport-centre { grid-column: 1 / -1; grid-row: 1; justify-self: stretch; }
  .transport-centre .transport-button { flex: 1; justify-content: center; }
  .transport-button { height: 44px; padding: 0 8px; font-size: 12px; }
}

      case 'confirm': input.stageNow(); break;
      case 'mute': updateTitleBlock(titleBlock, { audio: mixer.toggleMuted() ? 'MUTED' : 'ON' }); break;
      case 'warpUp': warpUp(); break;
      case 'warpDown': warpDown(); break;
      case 'zoomIn': camera.zoom(0.5); break;
      case 'zoomOut': camera.zoom(-0.5); break;
      case 'zoomReset': camera.resetZoom(); break;
      case 'zoom': camera.zoom(value); break;
      default: break;
    }
  }
  const { alpha } = loop.advance(nowMs / 1000, WARPS[warp]);
  if (replay) {
    advanceReplay(frameDt);
  } else {
    // A crash cuts hard to the report; a landing lets the touchdown settle first.
    const over = flight.phase !== 'flying' && flight.phase !== 'pad';
    if (over && !pageOpen && reportDueAt === null) {
      reportDueAt = flight.tick + (flight.phase === 'landed' ? 75 : 20);
      if (flight.phase === 'crashed') sfx.crash(); else if (flight.phase === 'landed') sfx.touchdown();
      setWarp(0);
    }
    if (reportDueAt !== null && !pageOpen && flight.tick >= reportDueAt) {
      reportDueAt = null;
      openPage('report', reportPage(flight));
    }
    // A flight whose goal is orbit gets its card once the stamp has landed.
    if (!orbitShown && flight.stats.orbit && flight.scenario.goal === 'orbit' && orbitDueAt === null) orbitDueAt = flight.tick + 150;
    if (orbitDueAt !== null && !pageOpen && !over && flight.tick >= orbitDueAt) {
      orbitDueAt = null;
      orbitShown = true;
      setWarp(0);
      openPage('orbit', orbitPage(flight));
    }
  }
  const scene = render(alpha, frameDt);
  const running = replay ? replay.playing && Math.abs(replay.speed) === 1 : warp === 0;
  sfx.setEngine(scene.phase === 'flying' && running ? scene.view.thrust / activeStage(scene.view, scene.src.cfg).maxThrust : 0);
  const metSeconds = Math.floor(scene.view.time);
  if (metSeconds !== lastMetShown) {
    lastMetShown = metSeconds;
    updateTitleBlock(titleBlock, { met: metSeconds });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
openPage('start', startPage());
loop.pause();
// Relabel the card with the keys as printed on this keyboard, once known.
let knownKeys = {};
keyLabels(['KeyW', 'KeyS', 'KeyA', 'KeyD', 'KeyZ', 'KeyX']).then((keys) => {
  knownKeys = keys;
  if (pageOpen === 'start') openPage('start', startPage({ ...keys, ...input.observedLabels }));
  transport.setKeyLabels({ ...keys, ...input.observedLabels });
});
// Browsers without a layout map still reveal the layout as keys get typed.
input.onLabels((keys) => transport.setKeyLabels(keys));

// Pause the clock while the tab is hidden; resume cleanly when it comes back.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) loop.pause(); else if (!pageOpen && !replay && !userPaused) loop.resume();
});

surface.onResize(() => { layout(); render(0, 0); });

// Read-only hook for automated playtests (tools/check.js and friends).
window.__karman = {
  get flight() { return flight; },
  get phase() { return flight.phase; },
  get replay() { return replay; },
  get scenario() { return scenarioId; },
  get camera() { return camera; },
  get warp() { return WARPS[warp]; },
  scenarios: Object.keys(SCENARIOS),
};


return __exports;
})();
})();
</script>
</head>
<body>
  <canvas id="stage" aria-label="Kármán Program flight drawing" role="img"></canvas>
  <div id="overlay">
    <div id="touch-controls" class="touch-controls" aria-label="Flight controls"></div>
    <div id="title-block" class="title-block" aria-hidden="true"></div>
  </div>
  <div id="transport" aria-label="Replay transport"></div>
  <div id="page"></div>
  <noscript><p class="noscript">Kármán Program needs JavaScript to draw.</p></noscript>
</body>
</html>
